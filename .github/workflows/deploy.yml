name: Deploy legacy MVP to Cloud Run

# IMPORTANT:
# This workflow belongs to the legacy public MVP currently on main.
# The canonical Campoy Nexus / JobFit Alpha 1-3A implementation has not yet
# been synchronized into this public mirror. Deployment is therefore manual
# only to prevent documentation commits from publishing the obsolete service.

on:
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: jobfit-api
  REGION: europe-west4

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Stop if Nexus source has not been synchronized
        run: |
          echo "This workflow deploys the legacy public MVP, not Campoy Nexus."
          echo "Synchronize and validate the sanitized Nexus source before enabling public deployment."
          exit 1
